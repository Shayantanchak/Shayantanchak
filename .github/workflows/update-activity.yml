name: Update Dynamic Profile Activity

on:
  schedule:
    - cron: "0 0 * * *" # Runs everyday at 00:00 UTC
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants permission to update the repository

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Pull Recent GitHub Activity
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "chore(ci): update recent activity feed [skip ci]"
          MAX_LINES: 5
